agents:
  research:
    search_queries:
      - "{geo} civil engineering firm land development services"
      - "{geo} site development civil engineering firm"
      - "{geo} subdivision civil engineer grading drainage utility"
      - "{geo} land development engineering projects"
      - "{geo} civil engineering firm master planned community"
  scraping:
    preferred_paths:
      - ""
      - "services"
      - "projects"
      - "portfolio"
      - "about"
      - "careers"
    browser_fallback: false
  contact_discovery:
    target_titles:
      - CAD Manager
      - Design Manager
      - Civil Engineering Manager
      - Project Manager
      - Site Development Leader
      - Land Development Leader
      - Principal

scoring:
  pass_threshold: 70
  borderline_threshold: 60
  weights:
    land_development_focus: 30
    civil_3d_likelihood: 15
    drafting_intensity: 25
    ai_fit: 20
    firm_size: 10
  positive_keywords:
    land_development:
      - civil engineering
      - land development
      - site development
      - subdivision
      - master planned
      - residential development
      - commercial development
      - entitlement
    civil_3d:
      - civil engineering
      - civil 3d
      - autocad civil 3d
      - autocad
      - cad technician
      - cad designer
      - drafting
    drafting:
      - civil engineering
      - drainage
      - utility design
      - grading plan
      - drainage plan
      - stormwater
      - utility plan
      - construction documents
      - plan set
      - permit plans
      - erosion control
      - profiles
      - redlines
    ai_fit:
      - civil engineering
      - drainage
      - grading
      - utilities
      - utility
      - stormwater
      - production
      - design documents
      - plan review
      - construction administration
    firm_size:
      - offices
      - team
      - careers
      - hiring
      - project manager
      - principal
  exclusion_keywords:
    - survey only
    - land surveying only
    - geotechnical only
    - materials testing
    - environmental consulting only
    - mep only
    - electrical engineering only
    - architecture only
